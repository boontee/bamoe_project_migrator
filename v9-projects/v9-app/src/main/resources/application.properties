# =============================================================================
# BAMOE v9.5 — Evaluation Process Service
# application.properties
# Based on: IBM BAMOE docs upgrade/05-02-upgrading-client-server-projects.adoc
# =============================================================================

# ── HTTP ──────────────────────────────────────────────────────────────────────
quarkus.http.port=8080
# Bind to localhost only (security policy — never 0.0.0.0)
quarkus.http.host=localhost

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."org.jbpm".level=INFO
quarkus.log.category."org.kie".level=INFO
quarkus.log.category."org.drools".level=WARN

# ── OpenAPI / Swagger UI ──────────────────────────────────────────────────────
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/q/openapi

# ── Health ────────────────────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/q/health

# ── Dev-profile datasource (H2 in-memory) ────────────────────────────────────
# Active when running with mvn quarkus:dev or the "dev" Maven profile.
# For production, replace with PostgreSQL properties (see below).
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:kogito;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.hibernate-orm.database.generation=update

# ── Production datasource (PostgreSQL — configure via environment variables) ──
# Uncomment and set values (or inject via env vars) for production deployment.
# quarkus.datasource.db-kind=postgresql
# quarkus.datasource.username=${DB_USER}
# quarkus.datasource.password=${DB_PASSWORD}
# quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/kogito_db
# quarkus.hibernate-orm.database.generation=update
# kogito.persistence.type=jdbc

# ── Process SVG (diagram endpoint) ───────────────────────────────────────────
quarkus.kogito.data-index.url=http://localhost:8180

# ── User Task configuration ───────────────────────────────────────────────────
# In v9, user/group resolution is handled by the identity provider (OIDC).
# Disable dev-mode role assertions for local testing only.
%dev.quarkus.security.auth.enabled-in-dev-mode=false
